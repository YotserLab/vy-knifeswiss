<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Sub-rede</title>
  <style>
    :root {
      --bg: #0A0E1A;
      --card: #111827;
      --border: #1E2D4A;
      --cyan: #00D4FF;
      --text: #E8EAF6;
      --muted: #8B97C8;
      --gold: #F59E0B;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; }
    .header { margin-bottom: 20px; }
    .title { font-size: 20px; font-weight: 700; color: var(--cyan); }
    .subtitle { font-size: 13px; color: var(--muted); margin-top: 4px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .form-group { margin-bottom: 12px; }
    label { font-size: 12px; color: var(--muted); text-transform: uppercase; font-weight: 600; display: block; margin-bottom: 6px; }
    .row { display: flex; gap: 8px; }
    input, select {
      background: #070A12; border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); padding: 10px; font-size: 14px; outline: none;
    }
    input { flex: 2; }
    select { flex: 1; color: var(--cyan); font-weight: 600; }
    button {
      width: 100%; background: var(--cyan); color: var(--bg); border: none; border-radius: 8px;
      padding: 12px; font-weight: 700; cursor: pointer; font-size: 14px; margin-top: 6px;
    }
    .res-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #1E2D4A; font-size: 13px; }
    .res-row:last-child { border-bottom: none; }
    .res-lbl { color: var(--muted); }
    .res-val { font-family: monospace; font-weight: 600; color: var(--text); }
    .res-val.highlight { color: var(--cyan); }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">🧮 Calculadora CIDR & Sub-rede</div>
    <div class="subtitle">Análise de blocos de rede IPv4 e máscaras</div>
  </div>

  <div class="card">
    <div class="form-group">
      <label>Endereço IP e Prefixo CIDR</label>
      <div class="row">
        <input type="text" id="ipInput" value="192.168.1.50" placeholder="192.168.1.1" />
        <select id="cidrSelect">
          <!-- Populated by JS -->
        </select>
      </div>
    </div>
    <button onclick="calculate()">Calcular Sub-rede</button>
  </div>

  <div id="resultsCard" class="card" style="display: none;">
    <div class="res-row"><span class="res-lbl">Endereço de Rede:</span><span id="netAddr" class="res-val highlight"></span></div>
    <div class="res-row"><span class="res-lbl">Máscara de Sub-rede:</span><span id="netMask" class="res-val"></span></div>
    <div class="res-row"><span class="res-lbl">Máscara Wildcard:</span><span id="wildcard" class="res-val"></span></div>
    <div class="res-row"><span class="res-lbl">Broadcast:</span><span id="broadcast" class="res-val highlight"></span></div>
    <div class="res-row"><span class="res-lbl">Primeiro Host:</span><span id="firstHost" class="res-val"></span></div>
    <div class="res-row"><span class="res-lbl">Último Host:</span><span id="lastHost" class="res-val"></span></div>
    <div class="res-row"><span class="res-lbl">Hosts Utilizáveis:</span><span id="usableHosts" class="res-val" style="color: var(--gold);"></span></div>
  </div>

  <script>
    const select = document.getElementById('cidrSelect');
    for (let i = 32; i >= 1; i--) {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = '/' + i;
      if (i === 24) opt.selected = true;
      select.appendChild(opt);
    }

    function ip2int(ip) {
      return ip.split('.').reduce((acc, oct) => (acc << 8) + parseInt(oct, 10), 0) >>> 0;
    }

    function int2ip(int) {
      return [(int >>> 24) & 255, (int >>> 16) & 255, (int >>> 8) & 255, int & 255].join('.');
    }

    function calculate() {
      const ipStr = document.getElementById('ipInput').value.trim();
      const cidr = parseInt(document.getElementById('cidrSelect').value, 10);
      const parts = ipStr.split('.');
      if (parts.length !== 4 || parts.some(p => isNaN(p) || p < 0 || p > 255)) {
        if (window.VYKnife) window.VYKnife.toast("IP inválido!");
        else alert("IP inválido!");
        return;
      }

      const ipInt = ip2int(ipStr);
      const maskInt = cidr === 0 ? 0 : (~0 << (32 - cidr)) >>> 0;
      const wildcardInt = ~maskInt >>> 0;
      const netInt = (ipInt & maskInt) >>> 0;
      const broadInt = (netInt | wildcardInt) >>> 0;

      const totalHosts = Math.pow(2, 32 - cidr);
      const usable = cidr >= 31 ? 0 : totalHosts - 2;

      document.getElementById('netAddr').textContent = int2ip(netInt);
      document.getElementById('netMask').textContent = int2ip(maskInt);
      document.getElementById('wildcard').textContent = int2ip(wildcardInt);
      document.getElementById('broadcast').textContent = int2ip(broadInt);
      document.getElementById('firstHost').textContent = cidr >= 31 ? 'N/A' : int2ip(netInt + 1);
      document.getElementById('lastHost').textContent = cidr >= 31 ? 'N/A' : int2ip(broadInt - 1);
      document.getElementById('usableHosts').textContent = usable.toLocaleString();

      document.getElementById('resultsCard').style.display = 'block';
    }

    calculate();
  </script>
</body>
</html>
