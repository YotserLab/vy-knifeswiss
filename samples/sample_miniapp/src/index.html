<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Mini</title>
    <style>
        body {
            background: #0A0E1A;
            color: #E8EAF6;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #00D4FF; font-size: 1.4rem; margin-top: 0; }
        .badge {
            display: inline-block;
            background: rgba(0, 212, 255, 0.15);
            color: #00D4FF;
            border: 1px solid #00D4FF;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 12px;
        }
        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 16px;
        }
        button {
            background: #111827;
            color: #00D4FF;
            border: 1px solid #1E2D4A;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-align: left;
            transition: 0.2s background;
        }
        button:active {
            background: #1B1F2C;
        }
        pre {
            background: #111827;
            border: 1px solid #1E2D4A;
            border-radius: 8px;
            padding: 12px;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 0.85rem;
            color: #A8E8FF;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <span class="badge">SANDBOX OFFLINE ATIVO</span>
    <h1>Hello Mini Security Pro</h1>
    <p>Mini-programa assinado com RSA-SHA256, verificação SHA-256 de assets e sandbox de rede.</p>

    <div class="actions">
        <button id="btnInfo">1. Ler Dados do Hardware (deviceInfo)</button>
        <button id="btnVibrate">2. Testar Vibração (vibrate)</button>
        <button id="btnToast">3. Enviar Notificação Toast (toast)</button>
        <button id="btnNetwork">4. Testar Exfiltração de Rede (deve falhar)</button>
    </div>

    <pre id="out">Clique em uma ação acima para testar a ponte segura.</pre>

    <script>
        const out = document.getElementById('out');

        document.getElementById('btnInfo').addEventListener('click', () => {
            try {
                const info = JSON.parse(VYBridge.getDeviceInfo());
                const manifest = JSON.parse(VYBridge.getManifest());
                out.textContent = 'Hardware detectado:\n' + JSON.stringify(info, null, 2) + '\n\nPermissões:\n' + JSON.stringify(manifest.permissions, null, 2);
            } catch (e) {
                out.textContent = 'Erro ao ler hardware: ' + e.message;
            }
        });

        document.getElementById('btnVibrate').addEventListener('click', () => {
            try {
                VYBridge.vibrate(100);
                out.textContent = 'Vibração de 100ms disparada com sucesso via bridge.';
            } catch (e) {
                out.textContent = 'Erro ao vibrar: ' + e.message;
            }
        });

        document.getElementById('btnToast').addEventListener('click', () => {
            try {
                VYBridge.toast('Olá! Notificação executada com permissão.');
                out.textContent = 'Toast exibido com sucesso!';
            } catch (e) {
                out.textContent = 'Erro no toast: ' + e.message;
            }
        });

        document.getElementById('btnNetwork').addEventListener('click', async () => {
            out.textContent = 'Tentando conectar a servidor externo (https://example.com)...';
            try {
                const res = await fetch('https://example.com');
                const text = await res.text();
                out.textContent = 'Resposta inesperada: ' + text;
            } catch (e) {
                out.textContent = 'Bloqueado com sucesso pelo Sandbox!\nDetalhe: ' + e.message;
            }
        });
    </script>
</body>
</html>
